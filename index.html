const rc=v=>`hsl(${Math.round(135-115*cl(v/80))} 75% 44%)`,cc=v=>`hsl(${Math.round(25+v*0.1)} ${Math.round(35+v*0.4)}% ${Math.round(72-v*0.3)}%)`;
const EVT=[
{id:'EV-001',t:'East Delta flood watch (Z01)',d:'2025-09-23',sev:'High',aff:['ION','JAD','ORI','UMB','VER'],dup:'EV-002 repeats the same bulletin (source family WX-0923) and is merged.',why:'Z01 hosts the only qualified power-die plant, the only qualified circuit-substrate plant, and their upstream wafer, ceramic and gas sites. No damage is confirmed yet.',act:'Ask IonPeak, Jade and Orion for flood-readiness status and buffer stock; confirm days of cover for M10/M20 and C10/B10.'},
{id:'EV-003',t:'Meridian financing pressure',d:'2025-09-24',sev:'High',aff:['MER'],why:'Meridian has the weakest balance sheet in the set and feeds dielectric film to the sole C20 capacitor supplier (P1, P2). Production continues for now.',act:'Check Delta Capacitor Works film stock and qualified alternates; open a dielectric-film alternate search (8-week capacitor qualification).'},
{id:'EV-010',t:'Gulf Arc port congestion',d:'2025-09-26',sev:'Watch',aff:[],why:'No supplier or facility in the data maps to the Gulf Arc lane, so the match is unconfirmed. Observed shipments are by ocean.',act:'Map supplier routings to Gulf Arc before escalating; delay is 3 days on average.'}];
const SUP=[['EV-002','Duplicate of EV-001 (same bulletin republished).'],['EV-004','Ion Peak Trading (REG-NO-4128) is an unrelated broker, not IonPeak Semiconductor.'],['EV-005','Port strike from 2023 reposted; no current dispute.'],['EV-007','Jade moved its head office (Z07). Production at SITE-081 is unaffected.'],['EV-009','Concerns Delta Consumer Plastics, which is not Delta Capacitor Works.']];
const OUT=[['Delta Consumer Plastics','Packaging trial in 2024 never became a supply award (DOC-084). Name similarity only.'],['Ion Peak Trading','Unrelated broker; not a subsidiary of IonPeak Semiconductor (DOC-077).'],['Harbor Freight Services','Freight consolidator, not a manufacturer (DOC-083).'],['IonPeak SITE-900','Pilot line on a different process; not a qualified replacement.'],['Delta housing award','Expired 31 Dec 2023; not a current H10 link.']];
let mode='risk',sel=null,tab='i',hi=null;
const svg=document.getElementById('g'),P=document.getElementById('p'),$=(t,a={},p=svg)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
function pth(a,b){const f=a.x>b.x,x1=f?a.x:a.x+a.w,x2=f?b.x+b.w:b.x,y1=a.y+a.h/2,y2=b.y+b.h/2,dx=(x2-x1)/2;return`M${x1},${y1}C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`}
function active(){let s=new Set,es=new Set;const add=k=>{s.add(k);down(k).forEach(x=>s.add(x));anc(k).forEach(x=>s.add(x))};
 if(!sel)return null;
 if(sel.t=='n')add(sel.id);else if(sel.t=='e'){const e=E[sel.id];add(e.s);add(e.d);s=new Set([...s].filter(x=>x==e.s||x==e.d||anc(e.s).has(x)||down(e.d).has(x)))}
 else if(sel.t=='v'){const v=EVT.find(x=>x.id==sel.id);v.aff.forEach(k=>{s.add(k);down(k).forEach(x=>s.add(x))})}
 let ps=sel.t=='n'?prods(sel.id):[...s].filter(x=>x[0]=='P'&&x.length==2);
 if(s.has('NDT')&&sel.t!='n')ps=[...new Set([...s].flatMap(k=>T1P[k]?T1P[k].match(/P\d/g):[]))];
 E.forEach(e=>{if(['P1','P2','P3'].includes(e.d)){if(s.has('NDT')&&ps.includes(e.d))es.add(e.id),s.add(e.d)}else if(s.has(e.s)&&s.has(e.d))es.add(e.id)});
 if(sel.t=='e')es.add(sel.id);return{s,es}}
function draw(){svg.innerHTML='';const A=active();
 [['Tier 3 · upstream inputs',14],['Tier 2 · sub-suppliers',240],['Tier 1 · direct suppliers',470],['NovaDrive',700],['Products',860]].forEach(([t,x])=>$('text',{x,y:36,class:'col'},svg).textContent=t);
 E.forEach(e=>{const a=N[e.s],b=N[e.d],al={AST:70,BOR:40,COB:100,GRO:80,HSE:20,DCW:100,EST:100,FOR:100}[e.s];const w=e.d=='NDT'?1.5+al/40:1.6;
  const d=pth(a,b),dm=A&&!A.es.has(e.id)?'dim':'';
  const st=e.st=='K'?'7 4':e.st=='H'||e.st=='L'?'2 4':e.st=='O'?'4 3':'';
  $('path',{d,class:'e '+dm,'stroke-width':w,'stroke-dasharray':st,style:e.st=='O'?'stroke:var(--own)':sel&&sel.t=='e'&&sel.id==e.id?'stroke:var(--ac);stroke-width:4':''});
  const h=$('path',{d,class:'eh',tabindex:0,role:'button','aria-label':a.name+' to '+b.name});h.onclick=()=>pick('e',e.id);h.onkeydown=ev=>ev.key=='Enter'&&pick('e',e.id)});
 Object.values(N).forEach(n=>{const sc=SC[n.k],dm=A&&!A.s.has(n.k)?'dim':'';
  const g=$('g',{class:'n '+dm+(sel&&sel.t=='n'&&sel.id==n.k?' sel':''),tabindex:0,role:'button','aria-label':n.name,transform:`translate(${n.x},${n.y})`});
  const un=n.st=='H'||n.st=='L';
  $('rect',{class:'b',width:n.w,height:n.h,rx:6,'stroke-dasharray':un?'3 3':'',style:n.tier==-1?'fill:var(--nd)':''},g);
  if(sc)$('rect',{width:6,height:n.h,rx:3,fill:mode=='risk'?rc(sc.tot):cc(sc.cf)},g);
  const tx=$('text',{x:n.tier<0?n.w/2:14,y:n.tier<0?n.h/2-1:16,'font-size':n.k=='CSH'?10.5:11,'font-weight':600,'text-anchor':n.tier<0?'middle':'start',style:n.tier==-1?'fill:#ffffff':''},g);tx.textContent=n.name;
  if(n.tier>=0){const t2=$('text',{x:14,y:30,'font-size':9,style:'fill:var(--mu)'},g);t2.textContent=n.cap+(n.st=='K'?' · inferred':un?' · unverified':'')}
  else if(n.tier==-2){const t2=$('text',{x:50,y:34,'font-size':9,'text-anchor':'middle',style:'fill:var(--mu)'},g);t2.textContent='$'+PR[n.k][1]+'m'}
  if(sc){const t3=$('text',{x:n.w-6,y:16,'font-size':11,'text-anchor':'end','font-weight':600},g);t3.textContent=Math.round(mode=='risk'?sc.tot:sc.cf)}
  g.onclick=()=>pick('n',n.k);g.onkeydown=ev=>ev.key=='Enter'&&pick('n',n.k)});}
const b=(l,c)=>`<span class="chip" style="${c?'border-color:'+c+';color:'+c+';background:var(--ac-subtle)':''}">${l}</span>`;
const nb=k=>`<button class="row" data-n="${k}"><b>${N[k].name}</b></button>`;
function node(k){const n=N[k],sc=SC[k],o='';
 const ins=E.filter(e=>e.d==k),outs=E.filter(e=>e.s==k&&!['P1','P2','P3'].includes(e.d));
 const lk=(e,w)=>`<button class="row" data-e="${e.id}"><b>${N[w=='in'?e.s:e.d].name}</b> <span class="mu sm">· ${e.c} · ${{C:'confirmed',K:'inferred',H:'hypothesis',L:'research lead',O:'ownership'}[e.st]}</span></button>`;
 const stt={C:'Confirmed in network',K:'Inferred (candidate)',H:'Hypothesis, not confirmed',L:'Research lead only',O:'Ownership link'}[n.st];
 let h=`<h2>${n.name}</h2><div class="mu sm">${n.tier>0?'Tier '+n.tier+' · ':''}${n.cap}${n.site&&n.tier>=0?' · '+n.site+' ('+n.zone+')':''}</div><p>${b(stt)}${sc?b('Risk '+Math.round(sc.tot)+' · '+band(sc.tot)):''}${sc?b('Confidence '+Math.round(sc.cf)):''}</p>`;
 if(n.k=='NDT')h+=`<p>All Tier-1 suppliers feed NovaDrive, which assembles P1, P2 and P3 ($1,560m combined revenue).</p>`;
 if(ins.length)h+=`<h3>Supplied by</h3>`+ins.map(e=>lk(e,'in')).join('');
 if(outs.length)h+=`<h3>Supplies</h3>`+outs.map(e=>lk(e,'out')).join('');
 if(sc){h+=`<h3>Products exposed</h3><p>${sc.ps.map(p=>b(N[p].name+' $'+PR[p][1]+'m')).join('')||'None'}</p><h3>Why this risk score</h3>`+sc.P.map(p=>`<div class="m"><span>${p[0]}</span><i><u style="width:${p[1]}%;background:${rc(p[1]*.8)}"></u></i><span>${Math.round(p[1])}${p[3]?'*':''}</span></div>`).join('')+`<div class="sm mu">* assumed neutral: data missing, not treated as low risk. Weights: exposure 25, substitutability 20, geography 20, financial 15, operations 10, assurance gap 10.</div><h3>Why this confidence</h3><div class="sm">${sc.why.join('; ')}.</div>`}
 else if(n.tier>=0)h+=`<h3>Risk</h3><div class="sm mu">Not scored: this entity is not a confirmed part of the network.</div>`;
 if(n.cr!=null||n.tl!=null)h+=`<h3>Indicators</h3><div class="sm">Current ratio ${n.cr??'n/a'} · Net debt/EBITDA ${n.nd??'n/a'} · On-time shipments ${n.tl??'n/a'}% (${n.ch>0?'+':''}${n.ch} pp since Jan) · Hazard ${n.hz??'n/a'} · Logistics ${n.lg??'n/a'} · Infrastructure ${n.inf??'n/a'}</div>`;
 const extra={ION:'Sole qualified die source for both module makers: switching assembler does not diversify die supply.',JAD:'Only qualified substrate source for C10 and B10 boards: Cobalt, Grove and HarborSense all depend on it.',CSH:'Aster and Boreal look like two sources but share one owner and one die supplier.',MER:'Weakest financials in the set (current ratio 0.62, leverage 7.2x, on-time down 17.6 pp).'}[k];
 return(extra?`<div class="row" style="border-left:3px solid var(--ac)"><b>Key insight.</b> ${extra}</div>`:'')+h}
function edge(id){const e=E[id],a=N[e.s],c=N[e.d];
 let h=`<h2>${a.name} → ${c.name}</h2><div class="mu sm">${e.c}</div><p>${b({C:'Confirmed',K:'Inferred',H:'Hypothesis',L:'Research lead',O:'Ownership'}[e.st])}${e.st=='C'&&e.ev.length>1?b(e.ev.length+' evidence records'):''}</p><p>${e.n}</p>`;
 if(e.ev.length){h+=`<h3>Evidence</h3>`+e.ev.map(t=>{const v=evi(e,t);return`<div class="ev"><b>${v.id}</b> <span class="mu sm">${v.ty} · ${v.dt}</span><div class="sm">${v.tx}</div></div>`}).join('');
  e.x.filter(z=>!e.ev.some(t=>t.replace(/[A-Z]$/,'')==z[0])).forEach(z=>h+=`<div class="ev"><b>${z[0]}</b> <span class="mu sm">${z[2]} · ${z[1]}</span><div class="sm">${z[3]}</div></div>`)}
 return h+`<h3>Jump to</h3>${nb(e.s)}${nb(e.d)}`}
function alerts(){return`<h2>Risk alerts</h2><div class="mu sm">Each event is matched to a facility or zone in the network, de-duplicated, then ranked.</div><h3>Needs action</h3>`+EVT.map(v=>`<button class="row" data-v="${v.id}" style="${hi==v.id?'border-color:var(--ac)':''}"><b>${v.t}</b> ${b(v.sev,v.sev=='High'?'#ea580c':'')}<div class="sm mu">${v.id} · ${v.d}</div>${hi==v.id?`<div class="sm"><p><b>Matched to:</b> ${v.aff.length?v.aff.map(k=>N[k].name).join(', '):'no supplier (lane not mapped)'}.${v.dup?' '+v.dup:''}</p><p><b>Why it matters:</b> ${v.why}</p><p><b>Next action:</b> ${v.act}</p></div>`:''}</button>`).join('')+`<h3>Suppressed as noise</h3>`+SUP.map(s=>`<div class="row sm"><b>${s[0]}</b> ${s[1]}</div>`).join('')}
function score_tab(){const r=Object.keys(N).filter(k=>SC[k]).sort((a,b)=>SC[b].tot-SC[a].tot);return`<h2>Scorecard</h2><div class="mu sm">Risk and evidence confidence are scored separately. Click a row to inspect.</div><table><tr><th>Supplier</th><th>Tier</th><th>Risk</th><th>Conf.</th></tr>`+r.map(k=>`<tr data-k="${k}"><td>${N[k].name}</td><td>${N[k].tier||'Own'}</td><td><b style="color:${rc(SC[k].tot*.9)}">${Math.round(SC[k].tot)}</b></td><td>${Math.round(SC[k].cf)}</td></tr>`).join('')+`</table>`}
function home(){return`<h2>Start here</h2><p class="mu">Click a supplier or a line. Three hidden concentrations stand out:</p>${nb('ION')}<div class="sm mu" style="margin:-2px 0 8px">One die source behind both module makers.</div>${nb('JAD')}<div class="sm mu" style="margin:-2px 0 8px">One substrate source behind all control and battery boards.</div>${nb('CSH')}<div class="sm mu" style="margin:-2px 0 8px">Aster and Boreal share one owner.</div><h3>Looked related, but ruled out</h3>`+OUT.map(o=>`<div class="row sm"><b>${o[0]}</b> ${o[1]}</div>`).join('')+`<h3>Reading the web</h3><div class="sm mu">Bar colour and number show risk (0–100) or evidence confidence. Line width on Tier-1 links reflects contracted allocation. Unverified leads (Solace, Alder) are drawn but not scored.</div>`}
function render(){P.innerHTML=tab=='a'?alerts():tab=='s'?score_tab():sel&&sel.t=='n'?node(sel.id):sel&&sel.t=='e'?edge(sel.id):home();
 P.querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>pick('n',x.dataset.n));P.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>pick('e',+x.dataset.e));
 P.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>pick('n',x.dataset.k));P.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{hi=hi==x.dataset.v?null:x.dataset.v;sel=hi?{t:'v',id:hi}:null;draw();render()});
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==tab))}
function pick(t,id){sel=sel&&sel.t==t&&sel.id==id?null:{t,id};tab='i';draw();render()}
document.querySelectorAll('.tabs button').forEach(x=>x.onclick=()=>{tab=x.dataset.t;render()});
document.querySelectorAll('.seg button').forEach(x=>x.onclick=()=>{mode=x.dataset.m;document.querySelectorAll('.seg button').forEach(y=>y.classList.toggle('on',y==x));draw()});
document.querySelectorAll('.theme-seg button').forEach(btn=>{
  btn.onclick=()=>{
    const t=btn.dataset.theme;
    document.documentElement.setAttribute('data-theme',t);
    document.querySelectorAll('.theme-seg button').forEach(b=>b.classList.toggle('on',b===btn));
  };
});
draw();render();
</script>
</body>
</html>
